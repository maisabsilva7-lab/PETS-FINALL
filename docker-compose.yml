version: 3.8

services:
  db:
    image: mysql:8.0
    container_name: mysql_cadastro_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cadastro
      MYSQL_USER: admin
      MYSQL_PASSWORD: '1234'
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
